<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Real-time browser object detection">
  <title>AI Object Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div><small>REAL-TIME VISION</small><h1>AI Object Detector</h1></div>
      <div class="status" aria-live="polite"><i id="status-dot" class="loading"></i><span id="status-text">Loading AI model...</span></div>
    </header>

    <section class="stage" aria-label="Live object detection camera">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="detection-canvas"></canvas>
      <div id="empty-state" class="empty"><b></b><p>Preparing camera and AI model...</p></div>
      <footer>
        <span>OBJECTS FOUND <strong id="object-count">0</strong></span>
        <button id="toggle-detection" disabled>STOP DETECTION</button>
      </footer>
    </section>

    <section class="results">
      <div class="results-head">
        <div><small>LIVE RESULTS</small><h2>Detected objects</h2></div>
        <span id="result-summary">Waiting for camera</span>
      </div>
      <div id="object-list" class="object-list" aria-live="polite">
        <p class="none">No objects detected yet.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
